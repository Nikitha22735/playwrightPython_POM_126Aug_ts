name: Playwright Tests for workflow dispatch
on:
  push: 
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  
    inputs:
      tag:
        description: "enter tag"
        required: true
        default: '@smoke'
  schedule:
    - cron: '30 21 11 * *'  # min hour day mnth weekday   --- UTC 
    - cron: '30 21 26 * *'  # min hour day mnth weekday   --- UTC 
  
jobs:
  test:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "${{inputs.tag}}"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
  dispatch-qa-playwright:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
    - name: Trigger QA Playwright workflow
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.QA_REPO_DISPATCH_TOKEN }}
        script: |
          await github.rest.repos.createDispatchEvent({
            owner: 'Nikitha22735',
            repo: 'qa',
            event_type: 'run-playwright-tests',
            client_payload: {
              tag: '@smoke',
              source_ref: context.ref,
              source_sha: context.sha
            }
          });
