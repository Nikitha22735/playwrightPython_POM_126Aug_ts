name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  
    inputs:
      tag:
        description: "enter tag"
        required: true
        default: '@smoke'
  schedule:
    - cron: '30 21 11 * *'  # min hour day mnth weekday   --- UTC 
    - cron: '30 21 26 * *'  # min hour day mnth weekday   --- UTC 
  repository_dispatch:
    types: [run-playwright-tests]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      cliusname: ${{ vars.AMAZONUSERNAME }}
      cliPw: ${{ secrets.PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag || '@smoke' }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Send email notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: outlook.office365.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: Playwright Test Report
        body: |
          The Playwright test report is attached.
          total tests: ${{ steps.test.outputs.total }}
          passed tests: ${{ steps.test.outputs.passed }}
          failed tests: ${{ steps.test.outputs.failed }}
        to: ${{ secrets.EMAIL_TO }}
        from: ${{ secrets.EMAIL_FROM }}
        secure: true
        attachments: playwright-report/
