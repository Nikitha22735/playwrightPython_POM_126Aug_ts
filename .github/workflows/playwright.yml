name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  
    inputs:
      tag:
        description: "enter tag"
        required: true
        default: '@smoke'
  schedule:
    - cron: '30 21 11 * *'  # min hour day mnth weekday   --- UTC 
    - cron: '30 21 26 * *'  # min hour day mnth weekday   --- UTC 
  repository_dispatch:
    types: [run-playwright-tests]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      cliusname: ${{ vars.AMAZONUSERNAME }}
      cliPw: ${{ vars.PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --grep "${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag || '@smoke' }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
